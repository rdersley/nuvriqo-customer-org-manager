modules:
  jira:adminPage:
    - key: nuvriqo-customer-org-manager-admin
      resource: main
      resolver:
        function: resolver
      title: Customer & Organisation Manager
      layout: blank
  trigger:
    # Client → Organisation sync. Skips unlicensed sites and the app's own edits.
    - key: org-sync-issue-events
      function: org-sync
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        appIsLicensed: true
        ignoreSelf: true
  function:
    - key: resolver
      handler: index.handler
    - key: org-sync
      handler: index.handleIssueEvent
resources:
  - key: main
    path: static/dist
permissions:
  scopes:
    # Why each scope is needed: docs/SECURITY.md
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - manage:servicedesk-customer
    - write:customer:jira-service-management
    - write:customer.profile:jira-service-management
    - read:task:jira-service-management
app:
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true
  id: ari:cloud:ecosystem::app/ef946f9f-5a25-47d1-96ca-b1a11530f57c
