name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Custom UI
        run: npm run build

      - name: Record dependency audit
        shell: bash
        run: |
          echo "## Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "### Root" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev || true
          echo "### Custom UI" >> "$GITHUB_STEP_SUMMARY"
          npm --prefix static audit --omit=dev || true

      - name: Install Forge CLI
        if: env.FORGE_EMAIL != '' && env.FORGE_API_TOKEN != ''
        run: npm install --global @forge/cli

      - name: Forge lint
        if: env.FORGE_EMAIL != '' && env.FORGE_API_TOKEN != ''
        shell: bash
        run: |
          forge settings set usage-analytics false
          forge settings set default-environment development
          set +e
          forge lint 2>&1 | tee /tmp/forge-lint.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q "UserNotFoundError" /tmp/forge-lint.log; then
            echo "## Forge access blocker" >> "$GITHUB_STEP_SUMMARY"
            echo "The configured CI Forge identity is valid but does not have access to app ef946f9f-5a25-47d1-96ca-b1a11530f57c (Customer & Organisation Manager)." >> "$GITHUB_STEP_SUMMARY"
            echo "Add the CI Forge account as an owner/contributor for this app in the Atlassian Developer Console, then rerun CI." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Note missing Forge credentials
        if: env.FORGE_EMAIL == '' || env.FORGE_API_TOKEN == ''
        run: echo "Forge credentials not configured; build passed but forge lint was skipped."
